limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
log_format json_combined escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8081;
  server_name _;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;

  include /etc/nginx/security-headers.conf;
  client_max_body_size 1m;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /metrics { return 403; }
  location = /health {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
  }

  location /pgadmin/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    proxy_pass http://pgadmin:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Script-Name /pgadmin;
    proxy_set_header X-Scheme https;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ /\. { deny all; }
}

